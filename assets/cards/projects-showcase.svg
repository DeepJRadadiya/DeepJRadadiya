<svg width="900" height="560" viewBox="0 0 900 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .section-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: #F8FAFC; letter-spacing: -0.5px; }
      .card-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #F8FAFC; letter-spacing: -0.3px; }
      .card-desc { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 400; fill: #8B94A0; letter-spacing: 0.1px; }
      .accent-header { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 12px; font-weight: 700; fill: #00F0FF; letter-spacing: 1.2px; text-transform: uppercase; }
      .tag-pill { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 600; fill: #00F0FF; letter-spacing: 0.4px; }
      .tag-pill-sec { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 10px; font-weight: 600; fill: #E2E8F0; letter-spacing: 0.4px; }
      .link-text { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #00A3FF; letter-spacing: 0.5px; }
    </style>
    
    <radialGradient id="header-glow" cx="150" cy="0" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.18">
        <animate attributeName="stop-opacity" values="0.12;0.22;0.12" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="card-glow1" cx="300" cy="50" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.12">
        <animate attributeName="stop-opacity" values="0.08;0.18;0.08" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0D0E12" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="card-glow2" cx="300" cy="50" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00A3FF" stop-opacity="0.12">
        <animate attributeName="stop-opacity" values="0.08;0.18;0.08" dur="4.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0D0E12" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Canvas background -->
  <rect width="898" height="558" x="1" y="1" rx="20" fill="#050505" stroke="#222630" stroke-width="1.5"/>
  <rect width="898" height="558" x="1" y="1" rx="20" fill="url(#header-glow)"/>

  <!-- Section Header -->
  <g transform="translate(32, 36)">
    <text x="0" y="0" class="accent-header">// FEATURED MISSIONS &amp; PLATFORMS</text>
    <text x="0" y="28" class="section-title">ENGINEERED FULL-STACK ARCHITECTURES</text>
    <line x1="0" y1="42" x2="834" y2="42" stroke="#222630" stroke-width="1"/>
    <!-- Tiny Travelling Light Particle on Header Line -->
    <circle cx="0" cy="42" r="2.5" fill="#00F0FF">
      <animate attributeName="cx" values="0;834;0" dur="12s" repeatCount="indefinite" ease="in-out"/>
    </circle>
  </g>

  <!-- GRID ROW 1: 2 Major Feature Cards (Width 409px each, Gap 16px) -->

  <!-- CARD 1: IRCTC-AutoBook -->
  <g transform="translate(32, 100)">
    <rect width="409" height="210" rx="14" fill="#0D0E12" stroke="#222630" stroke-width="1.2"/>
    <rect width="409" height="210" rx="14" fill="url(#card-glow1)"/>
    <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 140 0 L 120 4 L 0 4 Z" fill="#00F0FF" fill-opacity="0.8"/>
    
    <!-- Icon (Train/Lightning Automation with Pulse) -->
    <g transform="translate(24, 24)">
      <circle cx="22" cy="22" r="20" fill="#14161C" stroke="#00F0FF" stroke-width="1.5"/>
      <path d="M22 13 L17 23 L23 23 L21 32 L28 21 L22 21 Z" fill="#00F0FF">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>

    <text x="78" y="42" class="card-title">IRCTC-AutoBook</text>
    <text x="78" y="60" class="link-text">github.com/DeepJRadadiya/IRCTC-AutoBook ↗</text>

    <text x="24" y="98" class="card-desc">Full‑stack pre-booking train reservation system. Features automated</text>
    <text x="24" y="118" class="card-desc">background scheduling engines that trigger automated bookings instantly</text>
    <text x="24" y="138" class="card-desc">when ticket slots open, paired with real-time admin management.</text>

    <g transform="translate(24, 162)">
      <rect width="64" height="22" rx="4" fill="#14161C" stroke="#222630"/>
      <text x="8" y="15" class="tag-pill">DJANGO</text>

      <rect width="56" height="22" x="72" rx="4" fill="#14161C" stroke="#222630"/>
      <text x="80" y="15" class="tag-pill">REACT</text>

      <rect width="84" height="22" x="136" rx="4" fill="#14161C" stroke="#222630"/>
      <text x="144" y="15" class="tag-pill">SCHEDULER</text>

      <rect width="70" height="22" x="228" rx="4" fill="#14161C" stroke="#222630"/>
      <text x="236" y="15" class="tag-pill-sec">SQLITE</text>

      <rect width="45" height="22" x="306" rx="4" fill="#14161C" stroke="#222630"/>
      <text x="314" y="15" class="tag-pill-sec">JWT</text>
    </g>
  </g>

  <!-- CARD 2: Zynk -->
  <g transform="translate(457, 100)">
    <rect width="409" height="210" rx="14" fill="#0D0E12" stroke="#222630" stroke-width="1.2"/>
    <rect width="409" height="210" rx="14" fill="url(#card-glow2)"/>
    <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 140 0 L 120 4 L 0 4 Z" fill="#00A3FF" fill-opacity="0.8"/>

    <!-- Icon (Realtime Video/Signal with Pulse) -->
    <g transform="translate(24, 24)">
      <circle cx="22" cy="22" r="20" fill="#14161C" stroke="#00A3FF" stroke-width="1.5"/>
      <rect x="13" y="16" width="12" height="10" rx="2" stroke="#00F0FF" stroke-width="2" fill="none"/>
      <path d="M 26 19 L 31 16 L 31 26 L 26 23 Z" fill="#00F0FF"/>
      <circle cx="22" cy="21" r="2" fill="#00F0FF">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="78" y="42" class="card-title">Zynk Realtime Suite</text>
    <text x="78" y="60" class="link-text">github.com/DeepJRadadiya/Zynk ↗</text>

    <text x="24" y="98" class="card-desc">Real‑time multi-user communication &amp; video‑calling engine supporting</text>
    <text x="24" y="118" class="card-desc">typing indicators, emoji reactions, and ultra-low latency 1-on-1 &amp;</text>
    <text x="24" y="138" class="card-desc">group video sessions with active screen sharing &amp; media recording.</text>

    <g transform="translate(24, 162)">
      <rect width="64" height="22" rx="4" fill="#14161C" stroke="#222630"/>
      <text x="8" y="15" class="tag-pill">WEBRTC</text>

      <rect width="80" height="22" x="72" rx="4" fill="#14161C" stroke="#222630"/>
      <text x="80" y="15" class="tag-pill">SOCKET.IO</text>

      <rect width="84" height="22" x="160" rx="4" fill="#14161C" stroke="#222630"/>
      <text x="168" y="15" class="tag-pill">REALTIME</text>

      <rect width="88" height="22" x="252" rx="4" fill="#14161C" stroke="#222630"/>
      <text x="260" y="15" class="tag-pill-sec">JAVASCRIPT</text>
    </g>
  </g>

  <!-- GRID ROW 2: 3 Medium Feature Cards (Width 267px each, Gap 16px) -->

  <!-- CARD 3: Skill-Swap-Platform -->
  <g transform="translate(32, 326)">
    <rect width="267" height="200" rx="14" fill="#0D0E12" stroke="#222630" stroke-width="1.2"/>
    
    <g transform="translate(20, 20)">
      <circle cx="18" cy="18" r="16" fill="#14161C" stroke="#00F0FF" stroke-width="1.2"/>
      <path d="M14 14 L22 14 L19 11 M22 22 L14 22 L17 25" stroke="#00F0FF" stroke-width="2" stroke-linecap="round">
        <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
      </path>
    </g>

    <text x="66" y="38" class="card-title">Skill-Swap</text>
    <text x="20" y="78" class="card-desc">Collaborative MERN ecosystem for</text>
    <text x="20" y="98" class="card-desc">peer-to-peer skill exchanges without</text>
    <text x="20" y="118" class="card-desc">money. Features live request workflows,</text>
    <text x="20" y="138" class="card-desc">ratings &amp; moderation dashboards.</text>

    <g transform="translate(20, 158)">
      <rect width="45" height="22" rx="4" fill="#14161C" stroke="#222630"/>
      <text x="8" y="15" class="tag-pill">MERN</text>
      
      <rect width="75" height="22" x="53" rx="4" fill="#14161C" stroke="#222630"/>
      <text x="61" y="15" class="tag-pill">TAILWIND</text>
      
      <rect width="68" height="22" x="136" rx="4" fill="#14161C" stroke="#222630"/>
      <text x="144" y="15" class="tag-pill-sec">EXPRESS</text>
    </g>
  </g>

  <!-- CARD 4: SpendWise -->
  <g transform="translate(316, 326)">
    <rect width="267" height="200" rx="14" fill="#0D0E12" stroke="#222630" stroke-width="1.2"/>
    
    <g transform="translate(20, 20)">
      <circle cx="18" cy="18" r="16" fill="#14161C" stroke="#00A3FF" stroke-width="1.2"/>
      <path d="M12 24 L16 18 L20 21 L25 14" stroke="#00A3FF" stroke-width="2" stroke-linecap="round">
        <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>

    <text x="66" y="38" class="card-title">SpendWise</text>
    <text x="20" y="78" class="card-desc">Full-stack finance application for</text>
    <text x="20" y="98" class="card-desc">personal expense categorization and</text>
    <text x="20" y="118" class="card-desc">group trip budget calculation with</text>
    <text x="20" y="138" class="card-desc">automated split algorithms &amp; charts.</text>

    <g transform="translate(20, 158)">
      <rect width="45" height="22" rx="4" fill="#14161C" stroke="#222630"/>
      <text x="8" y="15" class="tag-pill">REACT</text>
      
      <rect width="65" height="22" x="53" rx="4" fill="#14161C" stroke="#222630"/>
      <text x="61" y="15" class="tag-pill">NODE.JS</text>
      
      <rect width="65" height="22" x="126" rx="4" fill="#14161C" stroke="#222630"/>
      <text x="134" y="15" class="tag-pill-sec">MONGODB</text>
    </g>
  </g>

  <!-- CARD 5: Batting-Mania -->
  <g transform="translate(601, 326)">
    <rect width="265" height="200" rx="14" fill="#0D0E12" stroke="#222630" stroke-width="1.2"/>
    
    <g transform="translate(20, 20)">
      <circle cx="18" cy="18" r="16" fill="#14161C" stroke="#00F0FF" stroke-width="1.2"/>
      <path d="M14 13 L22 13 L20 20 L16 20 Z M16 23 L20 23" stroke="#00F0FF" stroke-width="2" stroke-linecap="round">
        <animate attributeName="opacity" values="1;0.4;1" dur="2.7s" repeatCount="indefinite"/>
      </path>
    </g>

    <text x="66" y="38" class="card-title">Batting-Mania</text>
    <text x="20" y="78" class="card-desc">Interactive gaming portal featuring</text>
    <text x="20" y="98" class="card-desc">engaging casual game loops, real‑money</text>
    <text x="20" y="118" class="card-desc">reward pools, live player leaderboards</text>
    <text x="20" y="138" class="card-desc">&amp; secure payment gateway flows.</text>

    <g transform="translate(20, 158)">
      <rect width="60" height="22" rx="4" fill="#14161C" stroke="#222630"/>
      <text x="8" y="15" class="tag-pill">HTML5 UI</text>
      
      <rect width="80" height="22" x="68" rx="4" fill="#14161C" stroke="#222630"/>
      <text x="76" y="15" class="tag-pill">INTERACTIVE</text>
      
      <rect width="65" height="22" x="156" rx="4" fill="#14161C" stroke="#222630"/>
      <text x="164" y="15" class="tag-pill-sec">GAMING</text>
    </g>
  </g>
</svg>
