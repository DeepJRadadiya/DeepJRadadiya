<svg width="210" height="46" viewBox="0 0 210 46" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .badge-title { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #10B981; letter-spacing: 1px; text-transform: uppercase; }
      .badge-val { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #F8FAFC; letter-spacing: -0.2px; }
    </style>
    <radialGradient id="in-glow" cx="24" cy="23" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Outer glass capsule -->
  <rect width="208" height="44" x="1" y="1" rx="22" fill="#0D0E12" stroke="#222630" stroke-width="1.2"/>
  <rect width="208" height="44" x="1" y="1" rx="22" fill="url(#in-glow)"/>
  
  <!-- LinkedIn Icon -->
  <g transform="translate(14, 11)">
    <rect width="24" height="24" rx="6" fill="#14161C" stroke="#10B981" stroke-width="1.2"/>
    <text x="6" y="17" font-family="'Inter', sans-serif" font-size="12" font-weight="900" fill="#10B981">in</text>
  </g>
  
  <!-- Text Content -->
  <text x="48" y="19" class="badge-title">LINKEDIN</text>
  <text x="48" y="34" class="badge-val">Connect Profile ↗</text>
  
  <!-- Right Action Indicator -->
  <circle cx="190" cy="23" r="2.5" fill="#059669" />
</svg>
