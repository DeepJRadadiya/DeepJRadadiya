<svg width="900" height="68" viewBox="0 0 900 68" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 800; fill: #F8FAFC; letter-spacing: -0.3px; }
      .accent { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #A78BFA; letter-spacing: 1.5px; text-transform: uppercase; }
      .status { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #F472B6; letter-spacing: 1px; }
    </style>

    <linearGradient id="trace-grad" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="1"/>
      <stop offset="40%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#222630" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="header-bg-glow" cx="150" cy="34" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.15">
        <animate attributeName="stop-opacity" values="0.1;0.22;0.1" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Console Shell -->
  <rect width="898" height="66" x="1" y="1" rx="14" fill="#050505" stroke="#222630" stroke-width="1.2"/>
  <rect width="898" height="66" x="1" y="1" rx="14" fill="url(#header-bg-glow)"/>
  
  <!-- Left Accent Bar -->
  <rect x="1" y="14" width="4" height="38" rx="2" fill="#A78BFA"/>

  <!-- Texts & Titles -->
  <g transform="translate(24, 25)">
    <text x="0" y="0" class="accent">// SYSTEM TELEMETRY &amp; GITHUB SIGNAL</text>
    <text x="0" y="24" class="title">OPEN SOURCE ANALYTICS &amp; COMMITMENT METRICS</text>
  </g>

  <!-- Animated Bottom Laser Trace -->
  <rect x="24" y="58" width="420" height="2" rx="1" fill="url(#trace-grad)"/>

  <!-- Right Status Indicator -->
  <g transform="translate(710, 24)">
    <rect width="165" height="26" rx="13" fill="#0D0E12" stroke="#222630" stroke-width="1"/>
    <circle cx="18" cy="13" r="3.5" fill="#F472B6">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18" cy="13" r="7" fill="none" stroke="#F472B6" stroke-width="1">
      <animate attributeName="r" values="3.5;9;3.5" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="17" class="status">LIVE FEED ON</text>
  </g>
</svg>
