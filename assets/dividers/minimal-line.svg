<svg width="900" height="24" viewBox="0 0 900 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ultra-smooth symmetrical fade from transparent -> vibrant -> transparent -->
    <linearGradient id="line-grad" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="25%" stop-color="#00F0FF" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#00F0FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle soft light halo around the center micro-design -->
    <radialGradient id="center-halo" cx="450" cy="12" r="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Left Side Hairline -->
  <line x1="100" y1="12" x2="438" y2="12" stroke="url(#line-grad)" stroke-width="1"/>

  <!-- Right Side Hairline -->
  <line x1="462" y1="12" x2="800" y2="12" stroke="url(#line-grad)" stroke-width="1"/>

  <!-- Tiny Ultra-Minimalist Central Design -->
  <g transform="translate(450, 12)">
    <!-- Soft Luminous Halo -->
    <circle cx="0" cy="0" r="10" fill="url(#center-halo)"/>

    <!-- Left micro-dot -->
    <circle cx="-6" cy="0" r="1" fill="#00A3FF" fill-opacity="0.7"/>

    <!-- Petite Center Diamond Node -->
    <path d="M 0 -2.5 L 2.5 0 L 0 2.5 L -2.5 0 Z" fill="#00FFA3">
      <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- Right micro-dot -->
    <circle cx="6" cy="0" r="1" fill="#00A3FF" fill-opacity="0.7"/>
  </g>
</svg>
