<svg width="900" height="36" viewBox="0 0 900 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trace-left" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#222630" stop-opacity="0" />
      <stop offset="60%" stop-color="#222630" stop-opacity="1" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="trace-right" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#222630" stop-opacity="1" />
      <stop offset="100%" stop-color="#222630" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="center-glow" cx="450" cy="18" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Central Glow Accent -->
  <rect x="400" y="0" width="100" height="36" fill="url(#center-glow)"/>

  <!-- Left PCB Trace -->
  <line x1="60" y1="18" x2="410" y2="18" stroke="url(#trace-left)" stroke-width="1.5"/>

  <!-- Right PCB Trace -->
  <line x1="490" y1="18" x2="840" y2="18" stroke="url(#trace-right)" stroke-width="1.5"/>

  <!-- Center High-Tech Junction Node -->
  <g transform="translate(450, 18)">
    <!-- Outer Brackets -->
    <path d="M-34 -5 L-39 0 L-34 5 M34 -5 L39 0 L34 5" stroke="#8B5CF6" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner Diamond -->
    <path d="M 0 -6 L 6 0 L 0 6 L -6 0 Z" fill="#A78BFA" stroke="#050505" stroke-width="1">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </path>
    
    <!-- Side Nodes -->
    <circle cx="-18" cy="0" r="2" fill="#222630"/>
    <circle cx="-25" cy="0" r="1.5" fill="#34D399">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="18" cy="0" r="2" fill="#222630"/>
    <circle cx="25" cy="0" r="1.5" fill="#34D399">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
