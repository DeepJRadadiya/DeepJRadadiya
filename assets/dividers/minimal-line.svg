<svg width="900" height="20" viewBox="0 0 900 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant full-width luminous line gradient -->
    <linearGradient id="full-line" x1="0" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#222630" stop-opacity="0.3" />
      <stop offset="25%" stop-color="#059669" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="1" />
      <stop offset="75%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#222630" stop-opacity="0.3" />
    </linearGradient>

    <!-- Subtle glow around the central line segment -->
    <filter id="glow-filter" x="300" y="0" width="300" height="20" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-Width Luminous Background Halo -->
  <line x1="15" y1="10" x2="885" y2="10" stroke="#10B981" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Crisp, Distinct Full-Width Minimalist Line -->
  <line x1="15" y1="10" x2="885" y2="10" stroke="url(#full-line)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Single Tiny, Clean Minimalist Center Design -->
  <g transform="translate(450, 10)">
    <!-- Small geometric center diamond node sitting directly atop the line -->
    <path d="M 0 -4 L 4 0 L 0 4 L -4 0 Z" fill="#050505" stroke="#10B981" stroke-width="1.5">
      <animate attributeName="stroke" values="#10B981;#34D399;#10B981" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
